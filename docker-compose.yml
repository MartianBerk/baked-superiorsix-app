# Standalone app container. Expects APIs on the host (baked-devops/local-dev
# publishes 8010/8020/8030). For an all-in-one stack with Docker DNS upstreams,
# use: baked-devops/local-dev  →  docker compose --profile app up --build

services:
  baked-superiorsix-app:
    build: .
    image: baked-superiorsix-app:dev
    container_name: baked-superiorsix-app
    ports:
      - "8040:80"
    environment:
      AUTH_UPSTREAM: ${AUTH_UPSTREAM:-http://host.docker.internal:8010}
      USER_UPSTREAM: ${USER_UPSTREAM:-http://host.docker.internal:8020}
      SUPERSIX_UPSTREAM: ${SUPERSIX_UPSTREAM:-http://host.docker.internal:8030}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
